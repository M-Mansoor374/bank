<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Banking System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-icon">🏦</div>
            <h1 class="splash-title">Online Banking System</h1>
            <div class="splash-creators">
                <p class="splash-subtitle">This project is made by</p>
                <div class="creators-list">
                    <div class="creator-name">Daniyal Ayub</div>
                    <div class="creator-name">Hamza Altaf</div>
                    <div class="creator-name">Jawad Khan</div>
                </div>
            </div>
        </div>
    </div>

    <div class="container" id="mainContent" style="display: none;">
        <h1>🏦 Online Banking</h1>
        <p class="subtitle">Please login to access your account</p>
        
        <div id="errorMessage" class="error-message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Email / Username</label>
                <input 
                    type="email" 
                    id="username" 
                    name="username" 
                    placeholder="Enter your email"
                    required
                    autocomplete="username"
                >
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>
            
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
    
    <script src="js/init.js"></script>
    <script src="js/splash.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
