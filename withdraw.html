<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - Online Banking System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>💸 Withdraw Money</h1>
        <p class="subtitle">Withdraw funds from your account</p>
        
        <div class="balance-card" style="margin-bottom: 20px;">
            <div class="balance-label">Available Balance</div>
            <div class="balance-amount" id="availableBalance">Rs 0.00</div>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="withdrawForm">
            <div class="form-group">
                <label for="amount">Withdrawal Amount (Rs)</label>
                <input 
                    type="number" 
                    id="amount" 
                    name="amount" 
                    placeholder="Enter amount to withdraw"
                    min="0.01"
                    step="0.01"
                    required
                >
            </div>
            
            <button type="submit" class="btn">Withdraw</button>
            <a href="dashboard.html" class="btn btn-secondary" style="text-decoration: none; display: block; text-align: center; margin-top: 10px;">Back to Dashboard</a>
        </form>
    </div>
    
    <script src="js/init.js"></script>
    <script src="js/withdraw.js"></script>
</body>
</html>
