<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - Online Banking System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>💰 Deposit Money</h1>
        <p class="subtitle">Add funds to your account</p>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="depositForm">
            <div class="form-group">
                <label for="amount">Deposit Amount (Rs)</label>
                <input 
                    type="number" 
                    id="amount" 
                    name="amount" 
                    placeholder="Enter amount to deposit"
                    min="0.01"
                    step="0.01"
                    required
                >
            </div>
            
            <button type="submit" class="btn">Deposit</button>
            <a href="dashboard.html" class="btn btn-secondary" style="text-decoration: none; display: block; text-align: center; margin-top: 10px;">Back to Dashboard</a>
        </form>
    </div>
    
    <script src="js/init.js"></script>
    <script src="js/deposit.js"></script>
</body>
</html>
